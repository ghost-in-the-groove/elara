name: package

# Packages of the app and the CLI for each platform (ADR-0048), built from main
# and from pull requests that change how Elara installs, with the installers:
# the MSI package on Windows and the AppImage on Linux (ADR-0065). Each is
# smoke-tested from what it installs and kept as a workflow artifact; nothing is
# published.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - CMakeLists.txt
      - cmake/ElaraPackaging.cmake
      - src/app/CMakeLists.txt
      - src/cli/CMakeLists.txt
      - scripts/elara.py
      - .github/workflows/package.yml
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.12.1
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  package:
    name: package-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-2022 }
          - { name: macos, os: macos-15-intel }
          - { name: linux, os: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python tools
        run: python -m pip install py7zr ninja

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libegl1
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          echo "CC=gcc-14" >> "$GITHUB_ENV"

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-${{ hashFiles('scripts/install_qt.py') }}

      - name: Install Qt
        shell: bash
        run: |
          kit=$(python scripts/install_qt.py --version "$QT_VERSION" --outdir "$RUNNER_TEMP/Qt" 2>/dev/null | tail -n 1)
          echo "QT_ROOT_DIR=$kit" >> "$GITHUB_ENV"

      - name: vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          if [ "$RUNNER_OS" = "Windows" ]; then "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics; else "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics; fi
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}

      # The runner image has the WiX Toolset 3 (WIX), which CPack's MSI uses.
      - name: WiX Toolset
        if: runner.os == 'Windows'
        shell: bash
        run: test -x "$WIX/bin/candle.exe" && echo "WiX Toolset at $WIX"

      # appimagetool at a fixed release, checked against its published digest.
      - name: appimagetool
        if: runner.os == 'Linux'
        run: |
          tool="$RUNNER_TEMP/appimagetool"
          curl -fsSL -o "$tool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $tool" | sha256sum -c -
          chmod +x "$tool"
          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"

      # The SoundFont that comes with the packages (ADR-0069), downloaded and
      # checked by elara.py package: kept between runs.
      - name: Cache the included SoundFont
        uses: actions/cache@v4
        with:
          path: build/downloads/soundfont
          key: soundfont-${{ hashFiles('scripts/elara.py') }}
          restore-keys: soundfont-

      - name: Build, install, smoke-test and pack
        run: python scripts/elara.py package --installers

      - uses: actions/upload-artifact@v4
        with:
          name: elara-${{ matrix.name }}
          path: |
            build/package/Elara-*.zip
            build/package/Elara-*.msi
            build/package/Elara-*.dmg
            build/package/Elara-*.tar.gz
            build/package/Elara-*.AppImage
            build/package/Elara-*.sha256
          if-no-files-found: error
          retention-days: 14
