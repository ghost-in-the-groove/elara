name: package

# Packages of the app and the CLI for each platform (ADR-0048), built from main
# and from pull requests that change how Elara installs, with the installers:
# the MSI package on Windows and the AppImage on Linux (ADR-0065). Each is
# smoke-tested from what it installs and kept as a workflow artifact; nothing is
# published. release.yml calls it to build a release's packages (ADR-0138).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - CMakeLists.txt
      - cmake/ElaraPackaging.cmake
      - src/app/CMakeLists.txt
      - src/cli/CMakeLists.txt
      - scripts/elara.py
      - .github/workflows/package.yml
      - .github/actions/**
  workflow_call:
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.12.1
  # Compiled through ccache from the cache of ci.yml's last run on main, which
  # builds the release preset on Windows and macOS: most of a package's objects
  # come from there. Nothing is saved, so packages never evict CI's cache.
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 500M

jobs:
  package:
    name: package-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-2022 }
          - { name: macos, os: macos-15-intel }
          - { name: linux, os: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v7

      # The same vcpkg and cache as ci.yml's: the packages are built with the
      # vcpkg that CI tests.
      - uses: ./.github/actions/toolchain
        with:
          qt: ${{ env.QT_VERSION }}
          ccache: "true"

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-release-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-release-

      # The runner image has the WiX Toolset 3 (WIX), which CPack's MSI uses.
      - name: WiX Toolset
        if: runner.os == 'Windows'
        shell: bash
        run: test -x "$WIX/bin/candle.exe" && echo "WiX Toolset at $WIX"

      # appimagetool at a fixed release, checked against its published digest.
      - name: appimagetool
        if: runner.os == 'Linux'
        run: |
          tool="$RUNNER_TEMP/appimagetool"
          curl -fsSL -o "$tool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $tool" | sha256sum -c -
          chmod +x "$tool"
          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"

      # The SoundFont and the guitar SFZ instrument that come with the
      # packages (ADR-0069, ADR-0072), downloaded and checked by elara.py
      # package: kept between runs.
      - name: Cache the included sounds
        uses: actions/cache@v6
        with:
          path: |
            build/downloads/soundfont
            build/downloads/guitar-sfz
          key: sounds-${{ hashFiles('scripts/elara.py') }}
          restore-keys: sounds-

      - name: Build, install, smoke-test and pack
        run: python scripts/elara.py package --installers

      - uses: actions/upload-artifact@v7
        with:
          name: elara-${{ matrix.name }}
          path: |
            build/package/Elara-*.zip
            build/package/Elara-*.msi
            build/package/Elara-*.dmg
            build/package/Elara-*.tar.gz
            build/package/Elara-*.AppImage
            build/package/Elara-*.sha256
          if-no-files-found: error
          retention-days: 14
