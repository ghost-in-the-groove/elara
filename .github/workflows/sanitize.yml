name: sanitize

# Every test but the app's, built with AddressSanitizer and UndefinedBehavior-
# Sanitizer (ADR-0105): the importers read files from anywhere, and a read past
# a buffer or an overflowing shift there passes the ordinary tests unseen. The
# corpus snapshot tests import, lay out and render every corpus file, and the io
# tests read damaged containers. Not a required check: a finding fails this job
# and is fixed like any other test failure.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - src/core/**
      - src/audio/**
      - src/io/**
      - src/notation/**
      - src/cli/**
      - tests/**
      - cmake/**
      - CMakeLists.txt
      - CMakePresets.json
      - vcpkg.json
      - .github/workflows/sanitize.yml
      - .github/actions/**
  workflow_dispatch:

concurrency:
  group: sanitize-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 500M
  CTEST_PARALLEL_LEVEL: 4

jobs:
  sanitize:
    name: sanitize-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The same vcpkg and cache as ci.yml's linux job: the packages are not
      # instrumented, only Elara's own code is.
      - uses: ./.github/actions/toolchain
        with:
          ccache: "true"

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-sanitize-${{ github.sha }}
          restore-keys: ccache-sanitize-

      - name: Build and test with sanitizers
        run: python scripts/elara.py test --preset sanitize

      - name: Save ccache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-sanitize-${{ github.sha }}
