name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.12.1
  # Every compile goes through ccache; main's last cache is restored, so a pull
  # request only compiles the files it changes (see "Save ccache").
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 500M

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS test the release build, whose tests run in a
        # fraction of the debug build's time there; Linux keeps the debug
        # build and its assertions (ADR-0134).
        include:
          - { name: macos-arm64, os: macos-15, preset: release }
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          pip: ninja clang-format>=23,<24
          qt: ${{ env.QT_VERSION }}
          ccache: "true"

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-

      - name: Reset ccache statistics
        run: ccache --zero-stats

      - name: Check, build and test
        id: ci
        run: python scripts/elara.py ci --preset ${{ matrix.preset }}

      - name: ccache statistics
        if: always() && steps.ci.outcome != 'skipped'
        run: ccache --show-stats

      # Only main saves a cache, which pull requests restore: caches saved by a
      # pull request would serve no other branch and evict main's.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ github.sha }}
